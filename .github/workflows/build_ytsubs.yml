name: Build YT Subs

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and sign YT Subs
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Prepare signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$SIGNING_KEY_BASE64" | base64 -d > signingkey.jks
          chmod 600 signingkey.jks

      - name: Build YT Subs
        env:
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :src:en:ytsubs:assembleRelease

      - name: Show signer fingerprint and checksum
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$APKSIGNER" verify --print-certs src/en/ytsubs/build/outputs/apk/release/*.apk
          sha256sum src/en/ytsubs/build/outputs/apk/release/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: yt-subs-apk
          path: src/en/ytsubs/build/outputs/apk/release/*.apk
          retention-days: 3

      - name: Remove signing key
        if: always()
        run: rm -f signingkey.jks
